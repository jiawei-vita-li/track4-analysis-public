name: Publish Track 4 submission image

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Publish the candidate or verify an existing digest anonymously
        required: true
        type: choice
        options:
          - publish
          - anonymous-verify
      digest:
        description: Immutable sha256 digest for anonymous-verify mode
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE_REF: ghcr.io/jiawei-vita-li/agenthon-track4-agent
      CANDIDATE_TAG: dev-0c288e4

    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4

      - name: Prepare evidence directory
        run: mkdir -p publication-evidence

      - name: Build and push linux/amd64 candidate
        if: inputs.mode == 'publish'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin
          docker buildx build \
            --platform linux/amd64 \
            --file baselines/strong_rag_baseline/Dockerfile \
            --tag "$IMAGE_REF:$CANDIDATE_TAG" \
            --metadata-file publication-evidence/build-metadata.json \
            --push .
          docker logout ghcr.io >/dev/null

          python - <<'PY'
          import json
          import pathlib
          import re

          evidence = pathlib.Path("publication-evidence")
          metadata = json.loads((evidence / "build-metadata.json").read_text(encoding="utf-8"))
          digest = metadata.get("containerimage.digest", "")
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              raise SystemExit(f"invalid image digest: {digest!r}")
          (evidence / "digest.txt").write_text(digest + "\n", encoding="utf-8")
          (evidence / "publication-info.txt").write_text(
              "registry=ghcr.io\n"
              "repository=jiawei-vita-li/agenthon-track4-agent\n"
              f"digest={digest}\n"
              "platform=linux/amd64\n"
              "candidate_checkpoint=0c288e4\n",
              encoding="utf-8",
          )
          PY

          digest=$(cat publication-evidence/digest.txt)
          docker buildx imagetools inspect "$IMAGE_REF@$digest" \
            > publication-evidence/registry-inspect.txt

      - name: Pull immutable digest without GHCR credentials
        if: inputs.mode == 'anonymous-verify'
        env:
          IMAGE_DIGEST: ${{ inputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid immutable digest format" >&2
            exit 2
          fi
          anonymous_config=$(mktemp -d)
          trap 'rm -rf "$anonymous_config"' EXIT
          export DOCKER_CONFIG="$anonymous_config"
          docker pull "$IMAGE_REF@$IMAGE_DIGEST" \
            > publication-evidence/anonymous-pull.txt 2>&1
          docker image inspect "$IMAGE_REF@$IMAGE_DIGEST" \
            > publication-evidence/anonymous-image-inspect.json
          architecture=$(docker image inspect "$IMAGE_REF@$IMAGE_DIGEST" --format '{{.Architecture}}')
          os=$(docker image inspect "$IMAGE_REF@$IMAGE_DIGEST" --format '{{.Os}}')
          interface=$(docker image inspect "$IMAGE_REF@$IMAGE_DIGEST" \
            --format '{{index .Config.Labels "qfbench2.interface_version"}}')
          test "$architecture" = amd64
          test "$os" = linux
          test "$interface" = 2.0
          {
            echo "image=$IMAGE_REF@$IMAGE_DIGEST"
            echo "anonymous_docker_config=true"
            echo "pull=PASS"
            echo "architecture=$architecture"
            echo "os=$os"
            echo "interface_version=$interface"
          } > publication-evidence/anonymous-verification.txt

      - name: Upload non-secret publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-evidence-${{ github.run_id }}
          path: publication-evidence/
          if-no-files-found: error
          retention-days: 14
