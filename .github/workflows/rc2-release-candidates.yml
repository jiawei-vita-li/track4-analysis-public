name: RC2 R4.1 release candidate

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  candidate:
    name: ${{ matrix.name }} exact-source image
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: r4-1-treatment
            source: 80961b68768154ba05cbd6ba00f38e3e04a7b495
            tag: r4-1-80961b6
            comparative: "on"
    env:
      IMAGE_REF: ghcr.io/jiawei-vita-li/agenthon-track4-agent
      OFFICIAL_TRACK_SHA: ede7381d8c1ba9d8c84068f9d142f5e093a33892

    steps:
      - name: Check out exact frozen candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.source }}
          path: candidate
          fetch-depth: 1

      - name: Check out current official Track 4 verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Agenthon-2026/track4-analysis-public
          ref: ede7381d8c1ba9d8c84068f9d142f5e093a33892
          path: official
          fetch-depth: 1

      - name: Check out frozen R4-v1 answer control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 15a09731c607d10c42202aae3e0b28f72de9e2a6
          path: r4v1
          fetch-depth: 1

      - name: Check out pinned official toolkit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Agenthon-2026/Agenthon2026-public
          ref: v2.5.1
          path: hub
          fetch-depth: 1

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Install exact validation contracts
        run: |
          python -m pip install --upgrade pip
          python -m pip install jsonschema pytest ./hub/common
          python -m pip install --no-deps -e ./official
          python - <<'PY'
          import importlib.metadata
          assert importlib.metadata.version("qfbench2-common") == "2.5.1"
          from qfbench2_track_analysis import SCORER_VERSION
          assert SCORER_VERSION == "5.2.2"
          print("toolkit=2.5.1 scorer=5.2.2")
          PY

      - name: Run complete baseline tests on Linux
        working-directory: candidate
        run: python -m pytest baselines/tests baselines/strong_rag_baseline/tests -q

      - name: Verify immutable source and experiment invariant
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "${{ matrix.source }}"
          test "$(git -C official rev-parse HEAD)" = "$OFFICIAL_TRACK_SHA"
          test -f candidate/baselines/strong_rag_baseline/target_semantics.py
          if [[ "${{ matrix.comparative }}" == "absent" ]]; then
            test ! -e candidate/baselines/strong_rag_baseline/comparative_context.py
            ! grep -R -- '--comparative-context' candidate/baselines/strong_rag_baseline/*.py
          else
            test -f candidate/baselines/strong_rag_baseline/comparative_context.py
            grep -q -- '--comparative-context' candidate/baselines/strong_rag_baseline/cli.py
            grep -q 'default="on"' candidate/baselines/strong_rag_baseline/cli.py
          fi
          mkdir -p evidence outputs/normal outputs/unavailable
          {
            echo "candidate=${{ matrix.name }}"
            echo "source_commit=${{ matrix.source }}"
            echo "tag=${{ matrix.tag }}"
            echo "dockerfile_blob=$(git -C candidate rev-parse HEAD:baselines/strong_rag_baseline/Dockerfile)"
            echo "official_track_commit=$OFFICIAL_TRACK_SHA"
            echo "toolkit=2.5.1"
            echo "scorer=5.2.2"
            echo "comparative_context=${{ matrix.comparative }}"
          } > evidence/provenance.txt

      - name: Build and push exact linux/amd64 image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          docker buildx build \
            --platform linux/amd64 \
            --file candidate/baselines/strong_rag_baseline/Dockerfile \
            --label "org.opencontainers.image.revision=${{ matrix.source }}" \
            --tag "$IMAGE_REF:${{ matrix.tag }}" \
            --metadata-file evidence/build-metadata.json \
            --push candidate
          finished=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          docker logout ghcr.io >/dev/null
          digest=$(python - <<'PY'
          import json
          data = json.load(open("evidence/build-metadata.json", encoding="utf-8"))
          print(data["containerimage.digest"])
          PY
          )
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            echo "build_started_utc=$started"
            echo "build_finished_utc=$finished"
            echo "image=$IMAGE_REF@${digest}"
            echo "digest=$digest"
          } >> evidence/provenance.txt
          printf '%s\n' "$digest" > evidence/digest.txt

      - name: Anonymous immutable pull and image audit
        shell: bash
        run: |
          set -euo pipefail
          digest=$(cat evidence/digest.txt)
          anonymous_config=$(mktemp -d)
          trap 'rm -rf "$anonymous_config"' EXIT
          export DOCKER_CONFIG="$anonymous_config"
          docker pull "$IMAGE_REF@$digest" > evidence/anonymous-pull.txt 2>&1
          docker image inspect "$IMAGE_REF@$digest" > evidence/image-inspect.json
          docker history --no-trunc "$IMAGE_REF@$digest" > evidence/image-history.txt
          architecture=$(docker image inspect "$IMAGE_REF@$digest" --format '{{.Architecture}}')
          os=$(docker image inspect "$IMAGE_REF@$digest" --format '{{.Os}}')
          interface=$(docker image inspect "$IMAGE_REF@$digest" --format '{{index .Config.Labels "qfbench2.interface_version"}}')
          revision=$(docker image inspect "$IMAGE_REF@$digest" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
          size=$(docker image inspect "$IMAGE_REF@$digest" --format '{{.Size}}')
          test "$architecture" = amd64
          test "$os" = linux
          test "$interface" = 2.0
          test "$revision" = "${{ matrix.source }}"
          {
            echo "anonymous_pull=PASS"
            echo "architecture=$architecture"
            echo "os=$os"
            echo "interface_version=$interface"
            echo "revision=$revision"
            echo "image_size_bytes=$size"
          } >> evidence/provenance.txt

          cid=$(docker create "$IMAGE_REF@$digest")
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true; rm -rf "$anonymous_config"' EXIT
          docker export "$cid" | tar -tf - > evidence/image-files.txt
          docker rm "$cid" >/dev/null
          if grep -Eai '(^|/)(\.ssh(/|$)|\.git(/|$)|\.env($|\.)|id_rsa($|\.)|id_ed25519($|\.)|team-key|credentials($|\.)|huggingface(/|$)|\.cache(/|$)|submission\.zip$)' evidence/image-files.txt > evidence/forbidden-paths.txt; then
            echo "forbidden material found in image" >&2
            cat evidence/forbidden-paths.txt >&2
            exit 1
          fi
          if grep -Eai 'MODEL_TOKEN=|GITHUB_TOKEN=|team-key|api[_-]?key=' evidence/image-history.txt > evidence/forbidden-history.txt; then
            echo "secret-like build history found" >&2
            cat evidence/forbidden-history.txt >&2
            exit 1
          fi
          echo "image_secret_path_scan=PASS" >> evidence/provenance.txt

      - name: Run platform-like normal mock and unavailable-House fallback
        shell: bash
        run: |
          set -euo pipefail
          digest=$(cat evidence/digest.txt)
          image="$IMAGE_REF@$digest"

          run_sandbox() {
            local unit="$1"
            local out="$2"
            shift 2
            chmod 777 "$out"
            timeout 600s docker run --rm \
              --read-only \
              --user 65534:65534 \
              --cap-drop=ALL \
              --security-opt no-new-privileges \
              --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m \
              --pids-limit 256 \
              --ulimit nofile=1024:1024 \
              --ulimit nproc=256:256 \
              --cpus 2 \
              --memory 6g \
              --memory-swap 6g \
              --network=none \
              -e QFBENCH_SEED=0 \
              -e QFBENCH_NETWORK=none \
              "$@" \
              -v "$PWD/official/units/$unit:/input:ro" \
              -v "$PWD/$out:/output" \
              "$image" \
              analyze --task /input/task.json --corpus /input/corpus/ \
              --out /output/answer.json --trace /output/trace.json \
              > "$out/container.log" 2>&1
            test -s "$out/answer.json"
            test -s "$out/trace.json"
          }

          run_sandbox t4-cotpos-202411-us10 outputs/normal
          run_sandbox t4-credit-event-2023 outputs/unavailable \
            -e MODEL_ENDPOINT=http://127.0.0.1:9 \
            -e MODEL_NAME=unavailable-test \
            -e MODEL_TOKEN=not-a-secret \
            -e T4_MODEL_TIMEOUT_S=2 \
            -e T4_MODEL_RETRIES=1 \
            -e T4_UNIT_TIMEOUT_S=20

          if grep -Eai 'permission denied|read-only file system|cannot create|cannot write|\.cache|/root|/home' outputs/*/container.log > evidence/hidden-write-findings.txt; then
            echo "hidden-write dependency detected" >&2
            cat evidence/hidden-write-findings.txt >&2
            exit 1
          fi
          echo "platform_sandbox=PASS" >> evidence/provenance.txt

      - name: Validate schema roster cutoff citations and claims
        shell: bash
        run: |
          set -euo pipefail
          validate_output() {
            local unit="$1"
            local out="$2"
            python - "$PWD/official/units/$unit/task.json" "$out/answer.json" <<'PY'
          import importlib.resources as resources
          import json
          import jsonschema
          import sys

          task_path, answer_path = sys.argv[1:]
          schema_path = resources.files("qfbench2_common") / "schemas" / "analysis.schema.json"
          schema = json.loads(schema_path.read_text(encoding="utf-8"))
          task = json.load(open(task_path, encoding="utf-8"))
          answer = json.load(open(answer_path, encoding="utf-8"))
          jsonschema.validate(answer, schema)
          expected = [row["entity_id"] for row in task["entities"]]
          actual = [row["entity_id"] for row in answer["entity_predictions"]]
          assert actual == expected, (actual, expected)
          assert len(actual) == len(set(actual))
          assert all(row.get("claims") for row in answer["entity_predictions"])
          print("schema=PASS roster=PASS claims_present=PASS")
          PY
            PYTHONPATH="$PWD/official" qfbench2-smoke "$PWD/official/units/$unit" "$PWD/$out" \
              --track analysis --profile smoke | tee "$out/official-smoke.txt"
            qfbench2 manifest assert-public-safe "$PWD/official/units/$unit" \
              > "$out/manifest.txt"
            grep -q 'admissible=True' "$out/official-smoke.txt"
          }

          validate_output t4-cotpos-202411-us10 outputs/normal
          validate_output t4-credit-event-2023 outputs/unavailable
          python - "outputs/normal/trace.json" "${{ matrix.comparative }}" <<'PY'
          import json
          import sys

          trace = json.load(open(sys.argv[1], encoding="utf-8"))
          mode = sys.argv[2]
          prediction = trace.get("task_prediction", {})
          if mode == "on":
              assert prediction.get("comparative_context_version") == "1", prediction
              assert prediction.get("comparison_count", 0) > 0, prediction
          else:
              assert "comparative_context_version" not in prediction, prediction
          print(f"comparative_context={mode}: PASS")
          PY
          echo "schema_roster_cutoff_citations_claims=PASS" >> evidence/provenance.txt

      - name: Run and compare all 11 public mock units
        shell: bash
        run: |
          set -euo pipefail
          digest=$(cat evidence/digest.txt)
          image="$IMAGE_REF@$digest"
          mkdir -p outputs/public controls/r4v1
          unit_count=0

          for unit_dir in official/units/t4-*; do
            [[ -f "$unit_dir/task.json" && -d "$unit_dir/corpus" ]] || continue
            unit=$(basename "$unit_dir")
            unit_count=$((unit_count + 1))
            output="$PWD/outputs/public/$unit"
            control="$PWD/controls/r4v1/$unit"
            mkdir -p "$output" "$control"
            chmod 777 "$output"

            docker run --rm --network=none \
              -v "$PWD/$unit_dir:/input:ro" \
              -v "$output:/output" \
              "$image" \
              analyze --task /input/task.json --corpus /input/corpus/ \
              --out /output/answer.json --trace /output/trace.json --mock \
              > "$output/container.log" 2>&1

            PYTHONPATH="$PWD/r4v1" python -m baselines.strong_rag_baseline.cli \
              analyze --task "$PWD/$unit_dir/task.json" --corpus "$PWD/$unit_dir/corpus" \
              --out "$control/answer.json" --trace "$control/trace.json" --mock \
              > "$control/run.log" 2>&1

            cmp "$output/answer.json" "$control/answer.json"
            PYTHONPATH="$PWD/official" qfbench2-smoke "$PWD/$unit_dir" "$output" \
              --track analysis --profile smoke | tee "$output/official-smoke.txt"
            grep -q 'admissible=True' "$output/official-smoke.txt"
          done
          test "$unit_count" = 11

          python - <<'PY'
          import json
          from pathlib import Path

          rows = []
          for trace_path in sorted(Path("outputs/public").glob("*/trace.json")):
              trace = json.loads(trace_path.read_text(encoding="utf-8"))
              task = trace["task_prediction"]
              rows.append({
                  "unit": trace_path.parent.name,
                  "requests": trace["request_count"],
                  "batch_sizes": task["entities_per_batch"],
                  "request_chars": task["request_chars"],
                  "planned_actual_prompt_chars": task["planned_actual_prompt_chars"],
                  "parse_failures": len(task["parse_failures"]),
                  "prompt_guard_failures": len(task["prompt_guard_failures"]),
                  "repairs": int(task["repair_used"]),
                  "deferred": len(task["deferred_entity_ids"]),
                  "fallbacks": sum(
                      bool(entity.get("fallback_used"))
                      for entity in trace["entities"]
                  ),
              })
          summary = {
              "units": len(rows),
              "requests": sum(row["requests"] for row in rows),
              "batches": sum(len(row["batch_sizes"]) for row in rows),
              "total_request_chars": sum(
                  sum(row["request_chars"]) for row in rows
              ),
              "max_request_chars": max(
                  max(row["request_chars"]) for row in rows
              ),
              "parse_failures": sum(row["parse_failures"] for row in rows),
              "prompt_guard_failures": sum(
                  row["prompt_guard_failures"] for row in rows
              ),
              "repairs": sum(row["repairs"] for row in rows),
              "deferred": sum(row["deferred"] for row in rows),
              "fallbacks": sum(row["fallbacks"] for row in rows),
              "answers_byte_identical_to_r4v1": True,
          }
          Path("evidence/public-mock-summary.json").write_text(
              json.dumps({"summary": summary, "units": rows}, indent=2) + "\n",
              encoding="utf-8",
          )
          assert summary["units"] == 11
          assert summary["requests"] == 11
          assert summary["max_request_chars"] <= 48_000
          assert not summary["parse_failures"]
          assert not summary["prompt_guard_failures"]
          assert not summary["repairs"]
          assert not summary["deferred"]
          print(json.dumps(summary, indent=2))
          PY
          echo "public_11_mock_and_r4v1_byte_comparison=PASS" >> evidence/provenance.txt

      - name: Upload non-secret release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc2-${{ matrix.name }}-${{ github.run_id }}
          path: |
            evidence/
            outputs/*/answer.json
            outputs/*/trace.json
            outputs/*/official-smoke.txt
            outputs/*/manifest.txt
            outputs/*/container.log
            outputs/public/**
          if-no-files-found: warn
          retention-days: 14
